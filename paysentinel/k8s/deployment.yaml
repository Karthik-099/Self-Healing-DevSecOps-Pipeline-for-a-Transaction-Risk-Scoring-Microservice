apiVersion: apps/v1
kind: Deployment
metadata:
  name: paysentinel
  namespace: paysentinel
  labels:
    app: paysentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paysentinel
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: paysentinel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: paysentinel-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: paysentinel
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: LOG_LEVEL
              value: "INFO"
